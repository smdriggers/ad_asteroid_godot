name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Stamp build label
        run: |
          echo 'extends RefCounted' > build_info.gd
          echo 'class_name BuildInfo' >> build_info.gd
          echo "const LABEL: String = \"${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})\"" >> build_info.gd
          cat build_info.gd

      - name: Export web build
        run: |
          mkdir -p export/web
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "Web" export/web/index.html
          test -f export/web/index.html

      # GitHub Pages serves everything with max-age=600, and Godot's service
      # worker fetches the game files through the browser's HTTP cache. So a
      # new service worker installed within 10 minutes of the last visit can
      # cache the *previous* index.pck under the new version and stay stuck
      # on it. Make its fetches revalidate with the server (cheap: ETag) instead.
      - name: Make the service worker bypass the HTTP cache
        run: |
          sw=export/web/index.service.worker.js
          sed -i "s|cache.addAll(CACHED_FILES)|cache.addAll(CACHED_FILES.map((f) => new Request(f, { cache: 'no-cache' })))|" $sw
          sed -i "s|response = await self.fetch(event.request);|response = await self.fetch(event.request, { cache: 'no-cache' });|" $sw
          grep -q "CACHED_FILES.map((f) => new Request(f, { cache: 'no-cache' }))" $sw
          grep -q "self.fetch(event.request, { cache: 'no-cache' })" $sw

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
